name: renovate-hashes

# Renovate bumps `name==version` in requirements-ci.lock but cannot rewrite the
# `--hash=sha256:` lines beneath it, so every PyPI update arrives with the
# previous release's hashes and `pip install --require-hashes` fails validate
# (#677, #685, #693, #695). renovate.json asks for
# `node scripts/update-requirements-ci-hashes.mjs` as a post-upgrade task, but
# the identities that actually push these branches never run it: the
# organisation runner in projectbluefin/renovate-config has no
# `allowedCommands` and logs "Post-upgrade task did not match any on
# allowedCommands list", and the Mend-hosted app cannot execute commands at all
# (#676). Only this repository's own renovate.yml allowlists the task, and it
# is neither the first nor the most frequent runner to touch the branch (#686).
#
# So the repair runs here, on the pull request, regardless of which Renovate
# pushed it: recompile the lockfile with `uv pip compile --generate-hashes`,
# keeping Renovate's pins as preferences, and push the result back onto the
# Renovate branch. Recompiling rather than re-hashing the existing lines is
# what adds a dependency that the bumped release newly requires (#733).
#
# The same gap also leaves the image's runtime pins broken. Renovate bumps
# OMP_VERSION, GH_VERSION, NODE_VERSION, and TMUX_VERSION in
# image/contribute/Containerfile, and the post-upgrade tasks that supply the
# matching per-architecture digests (scripts/update-{omp,gh,node,tmux}-pins.mjs)
# are skipped by the very same runners that skip the hash task, so every
# runtime bump arrives with the previous release's digests and the build fails
# at `sha256sum -c`. The repair below now also re-runs those synchronizers on
# the pull request, under the same trust model: the code runs from main, the
# head contributes the Containerfile to be repaired, and the write token only
# reaches the push. That is why `image/contribute/Containerfile` is now on the
# trigger paths alongside requirements-ci.lock.
#
# Trust model. This job holds a token that can push to any branch of the
# repository, and main's ruleset blocks deletion and force-pushes but does not
# require a pull request, so that token must never reach code that arrived on
# the pull request:
#
#   - The trigger is pull_request_target, so this workflow definition and the
#     default checkout are read from main, never from the pull request head.
#     With plain pull_request both come from the head, and anyone able to
#     push to a Renovate branch could edit this file there, weaken the gate
#     below, and keep the write token. Someone pushing to a Renovate branch
#     cannot alter this job any more; only a change merged to main can.
#   - Nothing from the pull request head is executed. The script comes from
#     the default checkout of main; the head contributes exactly the managed
#     data files (requirements-ci.lock and image/contribute/Containerfile),
#     checked out into a separate directory by the event's head SHA and only
#     read.
#   - Neither checkout persists credentials. The token reaches the two public
#     things this job does: the `git push` that lands the refresh on
#     Renovate's branch, and the GitHub release lookups the pin synchronizers
#     make against api.github.com. It never reaches pull-request code; the
#     synchronizers run from main's checkout, not the head's.
#   - The job only runs for pull requests opened by one of the Renovate
#     identities (`renovate[bot]`, the Mend-hosted app; `mergeraptor[bot]`,
#     the organisation runner and this repository's own renovate.yml) from a
#     branch in this repository, and only when the event was raised by one of
#     those identities too: on `synchronize` github.actor is whoever pushed,
#     not who opened the pull request, so a person pushing onto a Renovate
#     branch does not get this job run on their commit. A branch prefix alone
#     is not an identity: anyone with write access can push
#     `renovate/anything`.
#
# pull_request_target hands the run secrets and a write-capable token by
# default, which is why `permissions: {}` at the top level revokes everything
# and the one job grants back only what its push and dispatch need.
#
# The push uses GITHUB_TOKEN, and a push made with GITHUB_TOKEN raises no push
# or pull_request event, so the refreshed commit would otherwise carry no
# checks and Renovate's automerge would wait on it forever. workflow_dispatch
# is the documented exception to that rule, so the last step dispatches
# validate.yml on the branch and its check lands on the new head commit. That
# dispatch is why the job holds `actions: write`. The same rule is what keeps
# this from looping: the push cannot re-trigger this workflow.
#
# The commit author is listed in renovate.json's gitIgnoredAuthors. Without
# that Renovate reads the refresh as a manual edit ("does not recognize the
# last commit author") and stops rebasing or updating the branch; see #638
# and the comment on #693.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - requirements-ci.lock
      - image/contribute/Containerfile

permissions: {}

# A newer Renovate push supersedes any refresh still running for the old head.
concurrency:
  group: renovate-hashes-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  refresh:
    # Renovate's own pull requests only. `branches:` above filters the base
    # branch, not the head, and the head prefix is only a convention, so the
    # gate is the pull request author plus the actor that raised this event:
    # the two GitHub App identities that open and push Renovate pull requests
    # here (see the trust model above). On `synchronize` the actor is the
    # pusher, so a person's push onto a Renovate branch does not run this. A
    # fork must never be pushed to anyway.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/') &&
      (
        github.event.pull_request.user.login == 'renovate[bot]' ||
        github.event.pull_request.user.login == 'mergeraptor[bot]'
      ) &&
      (
        github.actor == 'renovate[bot]' ||
        github.actor == 'mergeraptor[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the one `git push` that lands the refresh on the Renovate branch
      actions: write # `gh workflow run validate.yml` on the refreshed commit
    steps:
      - name: Check out main (the code that runs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # pull_request_target's default ref is the base branch tip, the same
          # commit this workflow file was read from. Not the merge ref and not
          # the head: this is the only checkout anything is executed from.
          path: base
          persist-credentials: false

      - name: Check out the Renovate head (the data that is repaired)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The exact commit the event describes, so the refresh is a child of
          # it and a branch that moved meanwhile rejects the push as a
          # non-fast-forward. Nothing in this tree is executed.
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # No cache: a pull_request_target job must not restore or save state
          # that a pull request could have shaped.
          enable-cache: false

      - name: Recompile requirements-ci.lock with uv
        id: refresh
        # The script resolves the lockfile from its working directory, so the
        # base's script runs with the head checkout as its working directory.
        # It runs uv with --no-build, so no package build backend executes,
        # and --no-config, so no uv configuration in the head is read.
        working-directory: head
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE}/base/scripts/update-requirements-ci-hashes.mjs"
          if git diff --quiet -- requirements-ci.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "requirements-ci.lock already matches its compiled dependency tree."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- requirements-ci.lock
          fi

      - name: Repair the containerfile pin digests
        id: pins
        # The pin synchronizers resolve the CURRENTLY pinned version against
        # GitHub releases and rewrite both architecture digests, so the version
        # bump Renovate left without its digests is corrected exactly the way
        # the hash task corrects the lockfile. They read api.github.com, so
        # they are handed this job's token the same way renovate.yml hands it
        # to them in its own run (renovate-tracking.test.mjs asserts that
        # hand-off); the token reaches those public reads, never pull-request
        # code.
        working-directory: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This job only runs when a managed file changed. Repair the pins
          # only when the Containerfile itself changed, so a lockfile-only PR
          # never spends four GitHub release lookups rewriting digests that are
          # already correct.
          if ! diff -q "${GITHUB_WORKSPACE}/base/image/contribute/Containerfile" "image/contribute/Containerfile" >/dev/null; then
            # All four runtime pins: any of them may be the one that drifted,
            # and each re-resolves only its own ARG, so the others are no-ops.
            node "${GITHUB_WORKSPACE}/base/scripts/update-omp-pins.mjs"
            node "${GITHUB_WORKSPACE}/base/scripts/update-gh-pins.mjs"
            node "${GITHUB_WORKSPACE}/base/scripts/update-node-pins.mjs"
            node "${GITHUB_WORKSPACE}/base/scripts/update-tmux-pins.mjs"
            if git diff --quiet -- image/contribute/Containerfile; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "containerfile pins already match their pinned versions."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              git --no-pager diff -- image/contribute/Containerfile
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the refresh onto the Renovate branch
        if: steps.refresh.outputs.changed == 'true' || steps.pins.outputs.changed == 'true'
        working-directory: head
        env:
          BRANCH: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage both managed files; git stages only what actually changed, so
          # a lockfile-only or pin-only refresh commits exactly one file.
          git add requirements-ci.lock image/contribute/Containerfile
          git commit --quiet \
            -m 'chore(deps): repair Renovate drift in lockfile hashes and containerfile pins' \
            -m "Renovate bumped the pinned versions but could not run the
          post-upgrade tasks that recompile requirements-ci.lock and refresh the
          OMP, GH, Node, and tmux digests, so the lockfile --hash lines, any newly
          required dependency, and the runtime pin digests were wrong and validate
          rejected the image.
          Repaired with scripts/update-requirements-ci-hashes.mjs and the
          scripts/update-*-pins.mjs synchronizers in ${RUN_URL}." \
            -- requirements-ci.lock image/contribute/Containerfile
          # The token appears here and nowhere else. A rejected push means
          # Renovate moved the branch while this ran; that push has its own
          # run of this workflow, so failing here is correct and loses nothing.
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            "HEAD:refs/heads/${BRANCH}"

      - name: Run validate on the refreshed commit
        if: steps.refresh.outputs.changed == 'true' || steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run validate.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}"
          echo "validate dispatched on ${BRANCH}; its check reports on the refreshed head commit."
