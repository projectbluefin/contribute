name: publish contribute image

on:
  # Daily rebuild picks up upstream Hive's tracking branch (v5) automatically
  # so the unpinned contributor image does not go stale.
  schedule:
    - cron: '40 3 * * *'
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

# A branch build is a moving pointer: a superseded run has nothing left to
# publish. A tag build is a release and is never cancelled.
concurrency:
  group: publish-contribute-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

# Each architecture is built by a runner of that architecture; the published
# artifact is an OCI index over those two digests. No shipped layer is ever
# produced under emulation, and every runtime claim below comes from a container
# the runner actually executed.
env:
  IMAGE: ghcr.io/projectbluefin/contribute
  BUILDAH_IMAGE: quay.io/buildah/stable:v1.43@sha256:ca4edbaabf71ca330ec9b2714bf8e06c726a6e85ae215cfb1474d2e2c832aacb

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'

      - name: Static hygiene
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.lock
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit message CI-skip guard contract
        run: |
          set -euo pipefail
          bash tests/check-commit-message.sh

      - name: Skill frontmatter valid and generated index fresh
        run: |
          set -euo pipefail
          bash scripts/check-skill-frontmatter.sh

      - name: Skill generator rejects unsafe manifest paths
        run: |
          set -euo pipefail
          bash tests/generate-skills.sh

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Justfile parses
        run: |
          set -euo pipefail
          just --justfile justfile --list

      - name: Launcher contracts
        run: |
          set -euo pipefail
          bash tests/launcher-contract.sh
      - name: Recipe bodies are valid bash
        run: |
          set -euo pipefail
          awk '
            /^[a-zA-Z][a-zA-Z0-9_-]*:$/ { flag=1; next }
            /^[^ \t#]/ { flag=0 }
            flag { print }
          ' justfile > recipe_bodies.sh
          bash -n recipe_bodies.sh
          rm -f recipe_bodies.sh

      - name: Contributor contracts
        run: |
          set -euo pipefail
          node --test tests/update-omp-pins.test.mjs
          node --test tests/update-derived-pins.test.mjs
          node --test tests/renovate-tracking.test.mjs
          bash tests/contribute-contract.sh

      - name: Interactive launcher docs and shell stay aligned
        run: |
          set -euo pipefail
          bash tests/readme-quickstart.sh
  # One source of truth for every OCI value in this run: the per-arch builds
  # stamp these as config labels and the index carries the identical set as
  # annotations, so `created` is decided once, before either.
  metadata:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.metadata.outputs.created }}
      version: ${{ steps.metadata.outputs.version }}
      base_name: ${{ steps.metadata.outputs.base_name }}
      base_digest: ${{ steps.metadata.outputs.base_digest }}
      hive_commit: ${{ steps.metadata.outputs.hive_commit }}
      stable: ${{ steps.metadata.outputs.stable }}
      tags: ${{ steps.metadata.outputs.tags }}
      sha_tag: ${{ steps.metadata.outputs.sha_tag }}
      release: ${{ steps.metadata.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve the contribute version and tag set
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          # FSDK series from the pinned base, tool revision from REVISION.
          version="$(bash scripts/contribute-version.sh)"
          base_image="$(sed -n 's/^ARG FSDK_BASE_IMAGE=\(.*\)$/\1/p' image/contribute/Containerfile)"
          base_name="${base_image%@*}"
          base_digest="${base_image##*@}"
          [[ "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
            { echo "contribute base must be digest-pinned, got: ${base_image}" >&2; exit 1; }

          # Hive's runtime is tracked, not pinned, so it is resolved per run —
          # but ONCE per run, here. Each architecture builds on its own runner
          # minutes apart, and upstream moves several times a day: resolving in
          # the build legs would publish an index whose amd64 and arm64 images
          # carry different Hive commits, with SBOMs and attestations that
          # disagree about a tag claiming to be one artifact.
          hive_commit="$(git ls-remote https://github.com/hivecommons/hive refs/heads/v5 | cut -f1)"
          [[ "$hive_commit" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "could not resolve hivecommons/hive v5" >&2; exit 1; }

          release=false
          # The repo SHA alone does NOT identify this image. A scheduled
          # rebuild runs at the same GITHUB_SHA and resolves whatever Hive's
          # tracking branch points at that morning, so `sha-<repo sha>` would
          # be overwritten with different contents while claiming to be
          # immutable — and an SBOM or attestation pinned to it would describe
          # an artifact that no longer exists. Name both halves of what went in.
          sha_tag="sha-${GITHUB_SHA}-hive-${hive_commit}"
          # Aliases only: the build tag itself is pushed once below, with the
          # digestfile, so listing it here too would push the same index twice.
          tags=""
          stable=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Release build: publish the immutable version tag and update stable pointer
            release=true
            tags="${tags} ${version} stable testing"
            stable=true
          elif [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            # Push to main or daily scheduled rebuild: update moving pointers only; do not consume immutable version tag
            tags="${tags} stable testing"
            stable=true
          fi

          {
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=${version}"
            echo "base_name=${base_name}"
            echo "base_digest=${base_digest}"
            echo "hive_commit=${hive_commit}"
            echo "stable=${stable}"
            echo "release=${release}"
            echo "tags=${tags}"
            echo "sha_tag=${sha_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to republish an existing version tag
        if: steps.metadata.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if skopeo inspect --raw "docker://${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} already exists. Bump image/contribute/REVISION." >&2
            exit 1
          fi
          echo "${IMAGE}:${VERSION} is free"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            uname: x86_64
          - arch: arm64
            runner: ubuntu-26.04-arm
            uname: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prove the native host
        shell: bash
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_UNAME"
          test "$(podman info --format '{{.Host.Arch}}')" = "$EXPECTED_ARCH"
          podman --version
          buildah --version
          skopeo --version

      - name: Build the contribute
        shell: bash
        env:
          CREATED: ${{ needs.metadata.outputs.created }}
          VERSION: ${{ needs.metadata.outputs.version }}
          BASE_NAME: ${{ needs.metadata.outputs.base_name }}
          BASE_DIGEST: ${{ needs.metadata.outputs.base_digest }}
          HIVE_COMMIT: ${{ needs.metadata.outputs.hive_commit }}
        run: |
          set -euo pipefail
          # One Hive commit for the whole run, resolved in the metadata job.
          # Passing it in (rather than resolving inside the build) is also what
          # moves the layer cache key when upstream moves, so the daily rebuild
          # actually refetches instead of reusing an earlier layer.
          echo "building with Hive ${HIVE_COMMIT}"
          podman build \
            --format oci \
            --build-arg CONTRIBUTE_VERSION="${VERSION}" \
            --build-arg CONTRIBUTE_REVISION="${GITHUB_SHA}" \
            --build-arg HIVE_COMMIT="${HIVE_COMMIT}" \
            --label "org.opencontainers.image.created=${CREATED}" \
            --label "org.opencontainers.image.base.name=${BASE_NAME}" \
            --label "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
            --file image/contribute/Containerfile \
            --tag contribute:smoke \
            .

      - name: Execute the shipped contribute on this architecture
        shell: bash
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          bash tests/contribute-contract.sh --image contribute:smoke



      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # podman is told its authfile by name; actions/attest reads
          # ~/.docker/config.json and nothing else.
          mkdir -p "${HOME}/.docker"
          for authfile in "${RUNNER_TEMP}/ghcr-auth.json" "${HOME}/.docker/config.json"; do
            printf '%s' "$GITHUB_TOKEN" |
              podman login ghcr.io --username "${GITHUB_ACTOR}" \
                --authfile "$authfile" --password-stdin
            chmod 0600 "$authfile"
          done

      - name: Push the per-architecture image
        id: push
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SHA_TAG: ${{ needs.metadata.outputs.sha_tag }}
        run: |
          set -euo pipefail
          # Staged in this repository's own namespace: a fork proves the image
          # with its own token, and only the guarded publish job turns these
          # digests into ':stable'.
          staging="ghcr.io/${GITHUB_REPOSITORY,,}-staging"
          target="${staging}:${SHA_TAG}-${ARCH}"
          podman push --format oci --authfile "${RUNNER_TEMP}/ghcr-auth.json" \
            --digestfile "${RUNNER_TEMP}/digest-${ARCH}.txt" \
            contribute:smoke "docker://${target}"
          digest="$(cat "${RUNNER_TEMP}/digest-${ARCH}.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "digest=${digest}"
            echo "image=${staging}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the digest for index assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contribute-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

      # Generated here, on the architecture it describes. Scanning the index
      # instead yields one platform's inventory attached to an artifact that
      # claims both. The in-image SPDX document rides through the sbom-cataloger.
      - name: Generate the SPDX SBOM for this architecture
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SELECT_CATALOGERS: "+sbom-cataloger"
        with:
          image: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: contribute-sbom-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance for this architecture
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM for this architecture
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: contribute-sbom-${{ matrix.arch }}.spdx.json
          push-to-registry: true
  publish:
    needs: [metadata, build]
    # Only the canonical repository turns proven digests into published tags.
    if: github.repository == 'projectbluefin/contribute'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download the per-architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: contribute-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          for authfile in "${RUNNER_TEMP}/ghcr-auth.json" "${HOME}/.docker/config.json"; do
            printf '%s' "$GITHUB_TOKEN" |
              podman login ghcr.io --username "${GITHUB_ACTOR}" \
                --authfile "$authfile" --password-stdin
            chmod 0600 "$authfile"
          done

      - name: Assemble and push the OCI index
        id: publish
        shell: bash
        env:
          CREATED: ${{ needs.metadata.outputs.created }}
          VERSION: ${{ needs.metadata.outputs.version }}
          BASE_NAME: ${{ needs.metadata.outputs.base_name }}
          BASE_DIGEST: ${{ needs.metadata.outputs.base_digest }}
          TAGS: ${{ needs.metadata.outputs.tags }}
          SHA_TAG: ${{ needs.metadata.outputs.sha_tag }}
        run: |
          set -euo pipefail
          staging="ghcr.io/${GITHUB_REPOSITORY,,}-staging"
          amd64="$(cat "${RUNNER_TEMP}/digests/digest-amd64.txt")"
          arm64="$(cat "${RUNNER_TEMP}/digests/digest-arm64.txt")"
          for digest in "$amd64" "$arm64"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done

          # Manifest assembly moves descriptors, never layers, so it runs in a
          # pinned unprivileged buildah rather than the runner's older one.
          # Manifest assembly moves descriptors, never layers, so it runs in a
          # pinned unprivileged buildah rather than the runner's older one. The
          # index is created, annotated and pushed by one container: a manifest
          # list does not survive the container that built it.
          script="$(mktemp)"
          cat >"$script" <<EOF
          set -euo pipefail
          buildah manifest create contribute:index
          buildah manifest add contribute:index docker://${staging}@${amd64}
          buildah manifest add contribute:index docker://${staging}@${arm64}
          for annotation in \
            "org.opencontainers.image.title=Hive Contribute" \
            "org.opencontainers.image.description=Distroless OMP contributor runtime for Hive-assigned work." \
            "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "org.opencontainers.image.version=${VERSION}" \
            "org.opencontainers.image.created=${CREATED}" \
            "org.opencontainers.image.licenses=Apache-2.0" \
            "org.opencontainers.image.base.name=${BASE_NAME}" \
            "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
            "io.hivecommons.contribute=true"; do
            buildah manifest annotate --index --annotation "\$annotation" contribute:index
          done
          for tag in ${TAGS}; do
            buildah manifest push --all --format oci contribute:index "docker://${IMAGE}:\${tag}"
          done
          buildah manifest push --all --format oci --digestfile /tmp/index-digest contribute:index "docker://${IMAGE}:${SHA_TAG}"
          cat /tmp/index-digest
          EOF
          digest="$(podman run --rm \
            --volume "${RUNNER_TEMP}/ghcr-auth.json:/auth.json:ro" \
            --volume "${script}:/publish.sh:ro" \
            --env REGISTRY_AUTH_FILE=/auth.json \
            --entrypoint bash \
            "$BUILDAH_IMAGE" /publish.sh | tail -1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true


      - name: Summarize the publication
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          STABLE: ${{ needs.metadata.outputs.stable }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          SHA_TAG: ${{ needs.metadata.outputs.sha_tag }}
        run: |
          set -euo pipefail
          {
            echo "## Hive Contribute"
            echo
            echo "Index digest: \`${DIGEST}\`"
            echo "Build tag: \`${IMAGE}:${SHA_TAG}\`"
            [[ "$STABLE" == true ]] && echo "Stable alias: \`${IMAGE}:stable\`"
          } >> "$GITHUB_STEP_SUMMARY"
