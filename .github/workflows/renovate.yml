name: Renovate

# Renovate runs with a Mergeraptor GitHub App installation token, not the
# default GITHUB_TOKEN. Pushes and pull requests made with GITHUB_TOKEN do not
# trigger other workflows, so Renovate's PRs used to arrive with no checks at all
# while renovate.json asked for them to be auto-merged. With an app token the
# pull-request gate runs, and Renovate's own automerge merges once checks are green.
#
# Mergeraptor is an org-level app whose permissions are already granted across
# projectbluefin repositories (consuming MERGERAPTOR_APP_ID / MERGERAPTOR_PRIVATE_KEY).
#
# Daily polling follows stable OMP GitHub releases. The repository package rule
# runs one allowlisted pin synchronizer, then OMP-only automerge lets the main
# push trigger both native image publishers.

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log only; create or update nothing
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get mergeraptor token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}

      - uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          # Renovate logs post-upgrade command compilation, execution, and the
          # resulting file filtering at debug. At info a pin synchronizer that
          # failed is indistinguishable from one that succeeded, which is how
          # renovate/omp-runtime stayed red for 28 consecutive validate runs
          # without a single signal. Debug is the permanent setting, not a
          # dry-run nicety.
          LOG_LEVEL: debug
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == true && 'full' || '' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^node scripts/update-omp-pins\\.mjs$", "^node scripts/update-gh-pins\\.mjs$", "^node scripts/update-node-pins\\.mjs$", "^node scripts/update-tmux-pins\\.mjs$", "^node scripts/update-requirements-ci-hashes\\.mjs$"]'
          # Post-upgrade commands do not inherit this job's environment.
          # Renovate builds their environment from its own `basicEnvVars`
          # allowlist (proxy, HOME, PATH, locale, CA-certificate and container
          # variables) unless `exposeAllEnv` is set, so RENOVATE_TOKEN and
          # GITHUB_TOKEN never reach them. Every pin synchronizer that reads a
          # GitHub release therefore called api.github.com anonymously and was
          # rate-limited against the runner's shared egress address, leaving the
          # version bumped and the digests stale. Hand the commands the same
          # app token through customEnvVariables rather than opening the whole
          # environment: Renovate already redacts this value from its logs, and
          # the app-token action masks it in the Actions log.
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GH_TOKEN": "${{ steps.app-token.outputs.token }}"}'
