name: validate

# bin/hive-contribute is the shipped launcher (with a thin justfile wrapper).
# This workflow validates Bash syntax, the contributor image contract, and
# mocked attended flows without requiring a live Hive account or interactive
# terminal.

on:
  push:
  pull_request:
  # Dispatched by renovate-hashes.yml after it pushes a hash refresh onto a
  # Renovate branch. That push is made with GITHUB_TOKEN, which raises no
  # push or pull_request event, so a dispatch is the only way the refreshed
  # head commit gets this check.
  workflow_dispatch:

permissions:
  attestations: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'

      # pre-commit/action is maintenance-only upstream, so run pre-commit
      # directly instead.
      - name: Static hygiene
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.lock
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit message CI-skip guard contract
        run: |
          set -euo pipefail
          bash tests/check-commit-message.sh

      - name: Skill frontmatter valid and generated index fresh
        run: |
          set -euo pipefail
          bash scripts/check-skill-frontmatter.sh
      - name: Skill generator rejects unsafe manifest paths
        run: |
          set -euo pipefail
          bash tests/generate-skills.sh

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Justfile parses
        run: |
          set -euo pipefail
          just --justfile justfile --list

      - name: Recipe bodies are valid bash
        run: |
          set -euo pipefail
          # Recipe headers in this file look like 'contribute:',
          # 'doctor:' — a bare identifier + colon at column 0,
          # no parameters. Grab every indented line following one, until the
          # next non-indented, non-comment, non-blank line.
          awk '
            /^[a-zA-Z][a-zA-Z0-9_-]*:$/ { flag=1; next }
            /^[^ \t#]/ { flag=0 }
            flag { print }
          ' justfile > recipe_bodies.sh
          bash -n recipe_bodies.sh
          rm -f recipe_bodies.sh

      - name: Test registry is complete
        run: |
          set -euo pipefail
          bash tests/test-registry.sh

      - name: Contributor and launcher contracts
        run: |
          set -euo pipefail
          node --test tests/update-omp-pins.test.mjs
          node --test tests/update-derived-pins.test.mjs
          node --test tests/renovate-tracking.test.mjs
          bash tests/contribute-contract.sh
          bash tests/launcher-contract.sh
          bash tests/version-derivation.sh

      - name: Interactive launcher docs and shell stay aligned
        run: |
          set -euo pipefail
          bash tests/readme-quickstart.sh

      - name: Build and execute contributor image
        run: |
          set -euo pipefail
          # Resolve Hive's tracking branch once and pass it in, exactly as the
          # justfile and publish workflow do. The build requires it: the final
          # stage cannot see a commit resolved inside the builder, so a missing
          # arg would ship an empty provenance label beside a populated
          # HIVE_COMMIT file. It refuses rather than build that image.
          hive_commit="$(git ls-remote https://github.com/hivecommons/hive refs/heads/v4 | cut -f1)"
          [[ "$hive_commit" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "could not resolve hivecommons/hive v4" >&2; exit 1; }
          podman build --format oci \
            --build-arg HIVE_COMMIT="$hive_commit" \
            -f image/contribute/Containerfile -t contribute:test .
          bash tests/contribute-contract.sh --image contribute:test

      # Interactive launchers prefer KVM microVMs. CI builds
      # and executes the OCI image natively.
