# Match the review appliance's 256-color terminal capability without advertising
# an xterm entry inside tmux. The outer client remains xterm-256color; panes use
# tmux-256color so tmux only receives sequences it implements.
set -g default-terminal "tmux-256color"

# The agent's own renderer checks COLORTERM before emitting 24-bit sequences.
# Ensure it is set inside tmux panes so the agent emits 24-bit direct color;
# tmux adapts the output to whatever the attach client actually supports.
set-environment -g COLORTERM "truecolor"

# Wheel-up enters copy mode, making long Hive and agent output readable.
set -g mouse on

# tmux keeps 2000 lines per pane by default, and a working agent turn overruns
# that in minutes: a post-mortem `capture-pane -S -30000` returned only the
# last 2019 lines, so the start of a task was already unrecoverable. Hive only
# ever ships the last few lines to the hub, which makes this pane the sole
# record a human can scroll back through.
set -g history-limit 50000

# Make the outer terminal mode obvious even when OMP changes the pane title.
set -g set-titles on
set -g set-titles-string "contribute - #{pane_title}"

# Lower third / status line styling: Bluefin theme (blue) with live hive & task tracking
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1e293b,fg=#93c5fd"
set -g status-left-length 60
set -g status-left "#[bg=#1d4ed8,fg=#ffffff,bold] 🦖 BLUEFIN #[bg=#2563eb,fg=#ffffff,nobold] contribute #[bg=#1e40af,fg=#bfdbfe] 🐝 #[default] "
set -g status-right-length 140
set -g status-right "#[fg=#93c5fd]contributor #[fg=#3b82f6]| #[fg=#bfdbfe]%H:%M #[default]"
